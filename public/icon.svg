<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer aura glow ring -->
  <circle cx="50" cy="50" r="46" stroke="#10b981" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="50" cy="50" r="38" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  
  <!-- Gravitational Event Horizon -->
  <defs>
    <radialGradient id="singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="60%" stop-color="#070b16"/>
      <stop offset="90%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Core Body -->
  <circle cx="50" cy="50" r="26" fill="url(#singularity)" stroke="url(#orbitGrad)" stroke-width="1.8"/>

  <!-- Orbital Acceleration Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="15" stroke="url(#orbitGrad)" stroke-width="1.5" transform="rotate(-30 50 50)" opacity="0.85"/>
  <ellipse cx="50" cy="50" rx="42" ry="15" stroke="url(#orbitGrad)" stroke-width="1.2" transform="rotate(30 50 50)" opacity="0.5"/>

  <!-- Core Singularity & Circuit Beams -->
  <circle cx="50" cy="50" r="8" fill="#10b981"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
  
  <!-- Coordinate nodes -->
  <circle cx="16" cy="30" r="2.5" fill="#10b981"/>
  <circle cx="84" cy="70" r="2.5" fill="#38bdf8"/>
  <circle cx="50" cy="8" r="2" fill="#6366f1"/>
  <circle cx="50" cy="92" r="2" fill="#10b981"/>
</svg>
