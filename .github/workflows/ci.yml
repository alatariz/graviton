name: CI Matrix & Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Zero Runtime Dependencies
        shell: bash
        run: |
          echo "Verifying package.json has 0 runtime dependencies..."
          node -e "
            const pkg = require('./package.json');
            if (pkg.dependencies && Object.keys(pkg.dependencies).length > 0) {
              console.error('ERROR: Core Graviton CLI must have 0 runtime dependencies!');
              process.exit(1);
            }
            console.log('✔ Zero runtime dependencies confirmed.');
          "

      - name: Run Master Test Suite (9 Suites)
        run: node test/run_all.js

      - name: Test CLI Global Binary Resolution
        shell: bash
        run: |
          node bin/graviton.js --version
          node bin/graviton.js --help
          node bin/graviton.js doc
