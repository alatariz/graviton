name: CodeQL Security Analysis & Supply-Chain Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL SAST Analysis (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  audit:
    name: Package Integrity & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Scan for Unintended Commits / Secrets
        shell: bash
        run: |
          echo "Verifying absence of hardcoded tokens or confidential API keys..."
          if grep -rnEI --exclude="workspace-helper.js" 'AIza[0-9A-Za-z-_]{35}' bin/ src/ test/ 2>/dev/null; then
            echo "ERROR: Hardcoded Google API key pattern detected!"
            exit 1
          fi
          if grep -rnEI 'sk-[a-zA-Z0-9]{32,}' bin/ src/ test/ 2>/dev/null; then
            echo "ERROR: Hardcoded OpenAI key pattern detected!"
            exit 1
          fi
          echo "✔ Secret scan passed cleanly. No credential leaks detected."
